<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Task Tracker & Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --urgent: #ef4444;
      --pending: #f59e0b;
      --completed: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .stat-card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .completed-fill { background: var(--completed); }
    .pending-fill { background: var(--pending); }
    .urgent-fill { background: var(--urgent); }

    /* Add Task Form */
    .add-task-panel {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .add-task-panel select,
    .add-task-panel input,
    .add-task-panel button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }

    .add-task-panel input[type="text"] {
      flex: 1;
      min-width: 220px;
    }

    .add-task-panel button {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .add-task-panel button:hover {
      opacity: 0.9;
    }

    /* Subjects Grid */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    .subject-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .subject-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .subject-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .task-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      background: #0f172a;
      gap: 8px;
      font-size: 0.9rem;
    }

    .task-title {
      flex: 1;
      word-break: break-word;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }

    .badge-urgent {
      background: rgba(239, 68, 68, 0.2);
      color: var(--urgent);
      border: 1px solid var(--urgent);
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.2);
      color: var(--pending);
      border: 1px solid var(--pending);
    }

    .badge-completed {
      background: rgba(16, 185, 129, 0.2);
      color: var(--completed);
      border: 1px solid var(--completed);
      text-decoration: line-through;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
    }

    .delete-btn:hover {
      color: var(--urgent);
    }

    .empty-state {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 Academic Study Tracker</h1>
      <p>Offline Ready • Automatic Progress Calculations</p>
    </header>

    <!-- Dashboard Section -->
    <section class="dashboard">
      <div class="stat-card">
        <h3>Total Tasks</h3>
        <div class="value" id="totalTasks">0</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 100%; background: var(--accent);"></div>
        </div>
      </div>

      <div class="stat-card">
        <h3>Completed Work</h3>
        <div class="value" id="completedStat">0% (0)</div>
        <div class="progress-bar">
          <div class="progress-fill completed-fill" id="completedBar"></div>
        </div>
      </div>

      <div class="stat-card">
        <h3>Pending Work</h3>
        <div class="value" id="pendingStat">0% (0)</div>
        <div class="progress-bar">
          <div class="progress-fill pending-fill" id="pendingBar"></div>
        </div>
      </div>

      <div class="stat-card">
        <h3>Urgent Work</h3>
        <div class="value" id="urgentStat">0% (0)</div>
        <div class="progress-bar">
          <div class="progress-fill urgent-fill" id="urgentBar"></div>
        </div>
      </div>
    </section>

    <!-- Add Task Input Panel -->
    <section class="add-task-panel">
      <select id="subjectSelect"></select>
      <input type="text" id="taskInput" placeholder="Enter task (e.g., Chapter 3 notes, Exercise 4.2)..." />
      <select id="statusSelect">
        <option value="pending">Pending</option>
        <option value="urgent">Urgent</option>
        <option value="completed">Completed</option>
      </select>
      <button onclick="addTask()">+ Add Task</button>
    </section>

    <!-- Subjects List Grid -->
    <section class="subjects-grid" id="subjectsGrid"></section>
  </div>

  <script>
    const SUBJECTS = [
      "Social Science",
      "Biology",
      "Physics",
      "Chemistry",
      "Mathematics",
      "Hindi - l",
      "Hindi - ll",
      "Information technology",
      "English",
      "English grammar",
      "Sanskrit",
      "Economics"
    ];

    // LocalStorage se data load ya default initialize
    let tasks = JSON.parse(localStorage.getItem("study_tasks")) || [];

    function saveTasks() {
      localStorage.setItem("study_tasks", JSON.stringify(tasks));
      render();
    }

    function initSubjectDropdown() {
      const select = document.getElementById("subjectSelect");
      select.innerHTML = SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join("");
    }

    function addTask() {
      const subject = document.getElementById("subjectSelect").value;
      const input = document.getElementById("taskInput");
      const title = input.value.trim();
      const status = document.getElementById("statusSelect").value;

      if (!title) return;

      tasks.push({
        id: Date.now(),
        subject,
        title,
        status // 'pending' | 'urgent' | 'completed'
      });

      input.value = "";
      saveTasks();
    }

    function toggleStatus(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      // Status sequence: Pending -> Urgent -> Completed -> Pending
      if (task.status === "pending") task.status = "urgent";
      else if (task.status === "urgent") task.status = "completed";
      else task.status = "pending";

      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function updateDashboard() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.status === "completed").length;
      const pending = tasks.filter(t => t.status === "pending").length;
      const urgent = tasks.filter(t => t.status === "urgent").length;

      const compPct = total ? Math.round((completed / total) * 100) : 0;
      const pendPct = total ? Math.round((pending / total) * 100) : 0;
      const urgPct = total ? Math.round((urgent / total) * 100) : 0;

      document.getElementById("totalTasks").innerText = total;
      document.getElementById("completedStat").innerText = `${compPct}% (${completed})`;
      document.getElementById("pendingStat").innerText = `${pendPct}% (${pending})`;
      document.getElementById("urgentStat").innerText = `${urgPct}% (${urgent})`;

      document.getElementById("completedBar").style.width = compPct + "%";
      document.getElementById("pendingBar").style.width = pendPct + "%";
      document.getElementById("urgentBar").style.width = urgPct + "%";
    }

    function renderSubjects() {
      const grid = document.getElementById("subjectsGrid");
      grid.innerHTML = "";

      SUBJECTS.forEach(subject => {
        const subjectTasks = tasks.filter(t => t.subject === subject);

        const card = document.createElement("div");
        card.className = "subject-card";

        let tasksHTML = "";
        if (subjectTasks.length === 0) {
          tasksHTML = `<div class="empty-state">No tasks yet</div>`;
        } else {
          tasksHTML = subjectTasks.map(t => `
            <li class="task-item">
              <span class="task-title ${t.status === 'completed' ? 'badge-completed' : ''}">${t.title}</span>
              <span class="status-badge badge-${t.status}" onclick="toggleStatus(${t.id})" title="Click to cycle status">
                ${t.status.toUpperCase()}
              </span>
              <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
            </li>
          `).join("");
        }

        card.innerHTML = `
          <div class="subject-header">
            <span class="subject-title">${subject}</span>
            <span class="task-count">${subjectTasks.length} task(s)</span>
          </div>
          <ul class="task-list">
            ${tasksHTML}
          </ul>
        `;

        grid.appendChild(card);
      });
    }

    function render() {
      updateDashboard();
      renderSubjects();
    }

    // Enter press shortcut
    document.getElementById("taskInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") addTask();
    });

    initSubjectDropdown();
    render();
  </script>
</body>
</html>
